services:
  - type: web
    name: cyber-attend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        syncValue: false
      - key: ADMIN_PASSWORD
        syncValue: false
      - key: PYTHON_VERSION
        value: 3.12.6
